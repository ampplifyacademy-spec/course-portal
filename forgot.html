<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset Password · Ampplify Academy</title>
<!-- The A-and-cap mark: browser tab, bookmarks, phone home screen, and the
     card that appears when a link is shared. -->
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/assets/icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Ampplify Academy">
<meta property="og:image" content="https://ampplifyacademy.com/assets/og-image.png">
<meta property="og:image:width" content="1024">
<meta property="og:image:height" content="1024">
<meta name="twitter:card" content="summary">
<meta property="og:title" content="Reset Password · Ampplify Academy">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
<link rel="preconnect" href="https://lh3.googleusercontent.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=14">
<link rel="stylesheet" href="css/animations.css?v=1">
</head>
<body>
<div class="card">
  <span class="brand"><img class="brand-mark" src="assets/logo.png" alt="Ampplify Academy" width="933" height="262"></span>
  <h1>Forgot Password?</h1>
  <p class="subtitle">Enter your email and we'll send you a reset link.</p>

  <label for="email">Email</label>
  <input id="email" type="email" placeholder="you@example.com">
  <button onclick="sendReset()">Send Reset Link</button>
  <p class="msg" id="msg"></p>
  <p class="link"><a href="login.html">Back to login</a></p>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/site-content.js?v=7"></script>
<script>
loadSiteContent();

function sendReset() {
  const email = document.getElementById('email').value.trim();
  const msg = document.getElementById('msg');
  if (!email) { msg.textContent = "Please enter your email"; return; }

  auth.sendPasswordResetEmail(email)
    .then(() => {
      msg.style.color = 'var(--success)';
      msg.textContent = "Reset link sent — check your inbox (and spam folder).";
    })
    .catch(err => { msg.style.color = 'var(--danger)'; msg.textContent = err.message; });
}
</script>
<script src="js/animations.js?v=1" defer></script>
</body>
</html>
