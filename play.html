<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Class · Ampplify Academy</title>
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0b0e17; --panel:#141a26; --line:#26304a; --text:#f3f5f9; --muted:#9aa3b8; --accent:#2f6df6; --orange:#ff8a3d; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 1rem; padding: .7rem 1.1rem; border-bottom: 1px solid var(--line); background: var(--panel); }
  .logo { font: 800 1rem "Plus Jakarta Sans", sans-serif; letter-spacing: -.01em; white-space: nowrap; }
  .logo span { color: var(--accent); }
  .logo em { color: var(--orange); font-style: normal; }
  h1 { font: 700 .98rem "Plus Jakarta Sans", sans-serif; margin: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  button, .btn { font: 600 .8rem Inter, sans-serif; border-radius: 8px; border: 1px solid var(--line); background: #1d2637; color: var(--text); padding: .45rem .9rem; cursor: pointer; text-decoration: none; }
  button:hover, .btn:hover { border-color: var(--accent); }
  .stage { flex: 1; position: relative; background: #000; }
  .stage iframe, .stage video { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #000; }
  .note { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); max-width: 520px; text-align: center; color: var(--muted); font-size: .9rem; line-height: 1.6; padding: 1rem; }
  .note b { color: var(--text); }
  footer { padding: .6rem 1.1rem; border-top: 1px solid var(--line); background: var(--panel); color: var(--muted); font-size: .78rem; line-height: 1.5; display: flex; align-items: center; gap: .8rem; flex-wrap: wrap; }
  footer b { color: var(--text); }
  .switch { display: flex; align-items: center; gap: .35rem; margin-left: auto; }
  .switch button { padding: .3rem .6rem; font-size: .75rem; }
  .switch button.on { border-color: var(--accent); background: var(--accent); }
</style>
</head>
<body>
<header>
  <div class="logo">AMP<span>P</span>LIFY <em>·</em> ACADEMY</div>
  <h1 id="title">Class</h1>
  <button onclick="window.close()">&times; Close</button>
</header>

<div class="stage" id="stage"></div>

<footer>
  <span id="footNote">Loading&hellip;</span>
  <span class="switch" id="switch" style="display:none;">
    <span>Not loading? Google account:</span>
    <button data-u="0">1st</button><button data-u="1">2nd</button><button data-u="2">3rd</button>
  </span>
</footer>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script>
  const params = new URLSearchParams(location.search);
  const fileId = (params.get('id') || '').replace(/[^\w-]/g, '');
  const kind   = params.get('kind') === 'folder' ? 'folder' : 'file';
  const title  = params.get('t') || 'Class';
  document.title = title + ' · Ampplify Academy';
  document.getElementById('title').textContent = title;

  const stage = document.getElementById('stage');
  const foot  = document.getElementById('footNote');

  // Which Google account in this browser holds the course email. Only used by
  // the Drive fallback: the embed ignores ?authuser= but honours the /u/<n>/
  // path, so the student picks once and the choice is kept per browser.
  const KEY = 'ampplify.driveUser';
  let userIndex = Number(localStorage.getItem(KEY) || 0) || 0;

  function clearStage() { stage.innerHTML = ''; }

  /** Our own proxy: the video is served by us, the student's Google account plays no part. */
  function showProxyPlayer(proxyUrl, idToken) {
    clearStage();
    const video = document.createElement('video');
    video.src = proxyUrl + '/v/' + fileId + '?token=' + encodeURIComponent(idToken);
    video.controls = true;
    video.autoplay = true;
    video.controlsList = 'nodownload';
    video.setAttribute('controlsList', 'nodownload');
    video.setAttribute('disablepictureinpicture', '');
    video.addEventListener('contextmenu', e => e.preventDefault());
    // The <video> element only ever says "an error occurred", so the reason is
    // fetched from the same URL and shown as the Worker wrote it.
    video.addEventListener('error', () => {
      foot.textContent = 'This class could not be played. Checking why…';
      fetch(video.src, { headers: { Range: 'bytes=0-99' } })
        .then(r => (r.ok ? null : r.json().catch(() => null)))
        .then(data => {
          foot.innerHTML = data && data.error
            ? '<b>' + data.error + '</b>'
            : 'This class could not be streamed. <b>Reload the page</b>, or contact support if it keeps failing.';
        })
        .catch(() => {
          foot.innerHTML = 'This class could not be streamed. <b>Reload the page</b>, or contact support if it keeps failing.';
        });
    });
    stage.appendChild(video);
    document.getElementById('switch').style.display = 'none';
    foot.textContent = 'Playing from Ampplify Academy.';
  }

  /** Fallback while no proxy is configured: the Drive embed, account and all. */
  function showDriveEmbed(email) {
    clearStage();
    const frame = document.createElement('iframe');
    frame.src = kind === 'folder'
      ? 'https://drive.google.com/embeddedfolderview?id=' + fileId + '#grid'
      : 'https://drive.google.com/u/' + userIndex + '/file/d/' + fileId + '/preview';
    frame.setAttribute('allow', 'autoplay; fullscreen; encrypted-media');
    frame.setAttribute('allowfullscreen', '');
    stage.appendChild(frame);
    foot.innerHTML = 'Plays with your course email &mdash; <b>' + email + '</b>.';
    document.getElementById('switch').style.display = kind === 'file' ? 'flex' : 'none';
    document.querySelectorAll('#switch button').forEach(b => {
      b.classList.toggle('on', Number(b.dataset.u) === userIndex);
    });
  }

  document.querySelectorAll('#switch button').forEach(b => {
    b.addEventListener('click', () => {
      userIndex = Number(b.dataset.u);
      localStorage.setItem(KEY, String(userIndex));
      showDriveEmbed(document.querySelector('#footNote b') ? document.querySelector('#footNote b').textContent : '');
    });
  });

  auth.onAuthStateChanged(user => {
    if (!user) { location.replace('login.html'); return; }
    if (!fileId) { foot.textContent = 'No class was given.'; return; }

    db.collection('siteContent').doc('videoProxy').get()
      .then(doc => (doc.exists ? doc.data().url : '') || '')
      .catch(() => '')
      .then(proxyUrl => {
        if (!proxyUrl) { showDriveEmbed(user.email || ''); return; }
        // A folder has no single file to stream, so it stays on the Drive view.
        if (kind === 'folder') { showDriveEmbed(user.email || ''); return; }
        return user.getIdToken().then(token => showProxyPlayer(proxyUrl, token));
      });
  });
</script>
</body>
</html>
