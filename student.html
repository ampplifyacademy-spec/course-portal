<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard · Ampplify Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
<link rel="preconnect" href="https://lh3.googleusercontent.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  .progress-badge { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: .9rem 1.25rem; text-align: right; }
  .progress-badge .label { color: var(--text-muted); font-size: .78rem; margin-bottom: .25rem; }
  .progress-badge .value { font: 800 1.4rem var(--font-display); color: var(--accent); }
  .batch-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.5rem; margin-bottom: 1.5rem; }
  .batch-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; cursor: pointer; display: flex; flex-direction: column; min-height: 356px; box-shadow: var(--shadow-sm); transition: border-color .15s ease, transform .15s ease, box-shadow .15s ease; }
  .batch-card:hover { border-color: var(--accent); transform: translateY(-3px); box-shadow: var(--shadow-md); }
  .batch-thumb { position: relative; width: 100%; height: 150px; display: flex; align-items: center; justify-content: center; font-size: 2.6rem; flex-shrink: 0; object-fit: cover; }
  .batch-card .body { padding: 1.25rem 1.4rem 1.4rem; display: flex; flex-direction: column; flex: 1; }
  .batch-card h3 { font-size: 1.05rem; margin-bottom: .4rem; }
  .batch-name-tag { display: block; color: var(--accent); font: 700 1.05rem var(--font-display); margin-bottom: .6rem; }
  .batch-card-top p { color: var(--text-muted); font-size: .87rem; }
  .batch-progress { display: flex; align-items: center; gap: .6rem; width: 100%; margin-top: auto; padding-top: .9rem; border-top: 1px solid var(--border); }
  .batch-progress .bar { flex: 1; height: 6px; background: var(--border); border-radius: 999px; overflow: hidden; }
  .batch-progress .bar .fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-orange)); }
  .batch-progress span { color: var(--text-muted); font-size: .78rem; white-space: nowrap; font-weight: 600; }
  .batch-panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  .batch-panel-head { display: flex; align-items: center; gap: .9rem; padding: 1.1rem 1.6rem; border-bottom: 1px solid var(--border); font-weight: 700; font-size: 1rem; }
  .batch-panel-back { background: none; border: 1px solid var(--border-strong); color: var(--text-muted); width: auto; margin: 0; padding: .4rem .8rem; font-size: .8rem; border-radius: var(--radius-sm); cursor: pointer; }
  .batch-panel-back:hover { border-color: var(--accent); color: var(--accent); }
  .class-row { display: flex; align-items: center; gap: 1rem; padding: 1rem 1.6rem; border-bottom: 1px solid var(--border); cursor: pointer; transition: background .15s ease; }
  .class-row:hover { background: rgba(16,24,40,.02); }
  .class-row:last-child { border-bottom: none; }
  .class-icon { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: .85rem; flex-shrink: 0; }
  .class-icon.done { background: var(--success-bg); color: var(--success); }
  .class-icon.todo { background: var(--border); color: var(--text-muted); }
  .class-row .info { flex: 1; }
  .class-row .info .title { font-weight: 600; font-size: .92rem; }
  .class-row .info .meta { color: var(--text-muted); font-size: .78rem; margin-top: .15rem; }
  .class-row .status { font-size: .82rem; font-weight: 600; color: var(--text-muted); }
  .class-row .status.done { color: var(--success); }
  .resource-row { display: flex; justify-content: space-between; align-items: center; padding: .9rem 1.1rem; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); margin-bottom: .6rem; }
  .resource-row a button { width: auto; margin: 0; padding: .4rem .9rem; font-size: .82rem; }
</style>
</head>
<body class="admin-shell">
<div class="admin-shell-grid">

  <div class="sidebar">
    <span class="brand"><span class="a">A</span>mpplify Academy</span>
    <div class="nav-item active" data-tab="dashboard" onclick="switchStudentTab('dashboard')"><span>🏠</span><span>Dashboard</span></div>
    <div class="nav-item" data-tab="tool" id="navTool" style="display:none;" onclick="switchStudentTab('tool')"><span>🛠️</span><span>My Tool</span></div>
    <div class="nav-item" data-tab="resources" onclick="switchStudentTab('resources')"><span>📄</span><span>Resources</span></div>
    <div class="nav-item" data-tab="resourceLinks" onclick="switchStudentTab('resourceLinks')"><span>🔗</span><span>Resource Link</span></div>
    <div class="nav-item" data-tab="settings" onclick="switchStudentTab('settings')"><span>⚙️</span><span>Settings</span></div>
    <div class="sidebar-footer">
      <div class="avatar" id="studentAvatar">S</div>
      <div>
        <div class="name" id="studentName">Student</div>
        <div class="role" id="studentBatchLabel">—</div>
      </div>
    </div>
    <button class="secondary" style="margin-top:1rem;" onclick="doLogout()">Log Out</button>
  </div>

  <div class="admin-main">
    <div class="admin-header">
      <div>
        <h1 id="welcomeTitle">Welcome back</h1>
        <p id="pageSubtitle">Here's your Amazon Selling Course progress.</p>
      </div>
      <div class="progress-badge" id="progressBadge">
        <div class="label">Overall progress</div>
        <div class="value" id="overallProgress">0%</div>
      </div>
    </div>

    <div class="tab-section active" id="tab-dashboard">
      <div id="batchWrap"></div>
    </div>

    <div class="tab-section" id="tab-tool">
      <div class="panel" id="toolPanel"></div>
    </div>

    <div class="tab-section" id="tab-resources">
      <div class="panel">
        <h2 style="margin-bottom:1rem;">Resources</h2>
        <div id="resourceWrap"></div>
      </div>
    </div>

    <div class="tab-section" id="tab-resourceLinks">
      <div class="panel">
        <h2 style="margin-bottom:1rem;">Resource Link</h2>
        <div id="resourceLinkWrap"></div>
      </div>
    </div>

    <div class="tab-section" id="tab-settings">
      <div class="panel">
        <h2 style="margin-bottom:1rem;">Change Password</h2>
        <label>Current password</label>
        <input id="currentPassword" type="password" placeholder="Current password">
        <label>New password</label>
        <input id="newPassword" type="password" placeholder="New password (min 6 characters)">
        <button onclick="changePassword()">Update Password</button>
        <p class="msg" id="passwordMsg"></p>
      </div>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/site-content.js?v=2"></script>
<script>
let batchThumbUrl = null;
loadSiteContent().then(content => {
  batchThumbUrl = content.course.batchThumbUrl ? driveImgUrl(content.course.batchThumbUrl) : null;
  if (currentBatchGroups.length) renderBatches(currentBatchGroups);
});
let currentUid = null;
let currentEmail = null;
let completedClasses = [];

const STUDENT_TAB_META = {
  dashboard: ['Here\'s your Amazon Selling Course progress.', true],
  tool: ['Your subscribed tool.', false],
  resources: ['Google Sheets, Docs, and other reference files.', false],
  resourceLinks: ['Useful external links, click to open.', false],
  settings: ['Update your password.', false]
};

function switchStudentTab(tab) {
  document.querySelectorAll('.nav-item').forEach(el => el.classList.toggle('active', el.dataset.tab === tab));
  document.querySelectorAll('.tab-section').forEach(el => el.classList.remove('active'));
  document.getElementById('tab-' + tab).classList.add('active');
  document.getElementById('pageSubtitle').textContent = STUDENT_TAB_META[tab][0];
  document.getElementById('progressBadge').style.display = STUDENT_TAB_META[tab][1] ? '' : 'none';
}

auth.onAuthStateChanged(user => {
  if (!user) { location.href = 'login.html'; return; }
  db.collection('users').doc(user.uid).get().then(doc => {
    if (!doc.exists || doc.data().status !== 'approved') {
      location.href = 'login.html';
      return;
    }
    const data = doc.data();
    currentUid = user.uid;
    currentEmail = user.email;
    completedClasses = data.completedClasses || [];

    const displayName = data.name || user.email;
    document.getElementById('studentName').textContent = displayName;
    document.getElementById('welcomeTitle').textContent = 'Welcome back, ' + displayName.split(' ')[0];

    document.getElementById('studentAvatar').textContent = displayName.charAt(0).toUpperCase();

    const mySession = localStorage.getItem('session_' + user.uid);
    if (data.currentSessionId && data.currentSessionId !== mySession) {
      kickOut(user.uid);
      return;
    }

    document.getElementById('studentBatchLabel').textContent = 'Student';

    if (data.productType === 'tool') {
      document.getElementById('navTool').style.display = '';
      document.getElementById('toolPanel').innerHTML = `
        <h2 style="margin-bottom:.5rem;">${data.toolName || 'Your Tool'}</h2>
        <p style="color:var(--text-muted); font-size:.85rem; margin-bottom:1.25rem;">${data.toolPrice ? data.toolPrice + ' ' + (data.toolCurrency || '') + ' / month subscription' : ''}</p>
        <a href="${data.toolLink || '#'}" target="_blank"><button style="width:auto;">Open Tool</button></a>`;
    }

    loadAllBatches(data.blockedCourses || []);
    loadResources();
    loadResourceLinks();
    watchSession(user.uid, mySession);
  });
});

function loadAllBatches(blockedCourses) {
  db.collection('courseContent').doc('main').get().then(contentDoc => {
    const allModules = contentDoc.exists ? (contentDoc.data().modules || []) : [];

    const folders = allModules.map((m, i) => {
      if (m.published === false) return null;
      const classes = [];
      if (m.lessonLinks && m.lessonLinks.length) {
        m.lessonLinks.forEach((l, j) => {
          classes.push({ id: 'mod-' + i + '-lesson-' + j, title: l.title, meta: l.duration || '', driveLink: l.driveLink });
        });
      } else if (m.driveLink) {
        classes.push({ id: 'mod-' + i, title: m.title, meta: m.duration || '', driveLink: m.driveLink });
      }
      return { key: 'mod-' + i, name: m.title || ('Module ' + (i + 1)), classes: classes.filter(c => !blockedCourses.includes(c.id)) };
    }).filter(Boolean);

    renderBatches(folders);
  });
}

let currentBatchGroups = [];
let activeBatchKey = null;

function renderBatches(batchGroups) {
  currentBatchGroups = batchGroups;
  const allClasses = batchGroups.flatMap(g => g.classes);
  const totalAll = allClasses.length;
  const completedAll = allClasses.filter(c => completedClasses.includes(c.id)).length;
  document.getElementById('overallProgress').textContent = totalAll ? Math.round((completedAll / totalAll) * 100) + '%' : '0%';

  if (activeBatchKey && batchGroups.some(g => g.key === activeBatchKey)) {
    renderBatchPanel();
  } else {
    activeBatchKey = null;
    renderBatchGrid();
  }
}

function renderBatchGrid() {
  const wrap = document.getElementById('batchWrap');
  if (!currentBatchGroups.length) {
    wrap.innerHTML = '<p style="color:var(--text-faint); font-size:.9rem;">No classes available yet.</p>';
    return;
  }

  const BATCH_THUMBS = [
    { emoji: '🎓', gradient: 'linear-gradient(135deg,#2563eb,#5fd0ff)' },
    { emoji: '📚', gradient: 'linear-gradient(135deg,#fd7d01,#ffab5c)' },
    { emoji: '🚀', gradient: 'linear-gradient(135deg,#16a34a,#5fe0a0)' },
    { emoji: '🛠️', gradient: 'linear-gradient(135deg,#7c3aed,#c084fc)' }
  ];
  const grid = currentBatchGroups.map((g, i) => {
    const total = g.classes.length;
    const completedCount = g.classes.filter(c => completedClasses.includes(c.id)).length;
    const pct = total ? Math.round((completedCount / total) * 100) : 0;
    const thumb = BATCH_THUMBS[i % BATCH_THUMBS.length];
    const thumbHtml = batchThumbUrl
      ? `<img class="batch-thumb" src="${batchThumbUrl}" alt="">`
      : `<div class="batch-thumb" style="background:${thumb.gradient};">${thumb.emoji}</div>`;
    return `
    <div class="batch-card" onclick="selectBatch('${g.key}')">
      ${thumbHtml}
      <div class="body">
        <h3>Amazon Live Course with AI</h3>
        <span class="batch-name-tag">${g.name}</span>
        <div class="batch-card-top"><p>${total} class${total === 1 ? '' : 'es'} · ${completedCount} completed</p></div>
        <div class="batch-progress">
          <div class="bar"><div class="fill" style="width:${pct}%;"></div></div>
          <span>${pct}%</span>
        </div>
      </div>
    </div>`;
  }).join('');

  wrap.innerHTML = `<div class="batch-grid">${grid}</div>`;
}

function renderBatchPanel() {
  const g = currentBatchGroups.find(x => x.key === activeBatchKey);
  const wrap = document.getElementById('batchWrap');
  if (!g) { renderBatchGrid(); return; }
  wrap.innerHTML = `
    <div class="batch-panel">
      <div class="batch-panel-head">
        <button class="batch-panel-back" onclick="backToBatchGrid()">← Back</button>
        <span>${g.name}</span>
      </div>
      ${g.classes.length === 0 ? '<p style="padding:1.25rem 1.6rem; color:var(--text-faint); font-size:.9rem;">No classes available yet.</p>' : g.classes.map(c => {
        const done = completedClasses.includes(c.id);
        return `
          <div class="class-row" onclick="toggleClassComplete('${c.id}')">
            <div class="class-icon ${done ? 'done' : 'todo'}">${done ? '✓' : '○'}</div>
            <div class="info">
              <div class="title">${c.title}</div>
              <div class="meta">${c.meta}</div>
            </div>
            <a href="${c.driveLink}" target="_blank" onclick="event.stopPropagation()"><button style="width:auto; margin:0; padding:.4rem .9rem; font-size:.8rem;">Watch</button></a>
            <span class="status ${done ? 'done' : ''}">${done ? 'Completed' : 'Upcoming'}</span>
          </div>`;
      }).join('')}
    </div>`;
}

function selectBatch(key) {
  activeBatchKey = key;
  renderBatchPanel();
}

function backToBatchGrid() {
  activeBatchKey = null;
  renderBatchGrid();
}

function toggleClassComplete(id) {
  const op = completedClasses.includes(id)
    ? firebase.firestore.FieldValue.arrayRemove(id)
    : firebase.firestore.FieldValue.arrayUnion(id);
  db.collection('users').doc(currentUid).update({ completedClasses: op }).then(() => {
    if (completedClasses.includes(id)) {
      completedClasses = completedClasses.filter(c => c !== id);
    } else {
      completedClasses.push(id);
    }
    db.collection('users').doc(currentUid).get().then(doc => {
      loadAllBatches(doc.data().blockedCourses || []);
    });
  });
}

function changePassword() {
  const currentPassword = document.getElementById('currentPassword').value;
  const newPassword = document.getElementById('newPassword').value;
  const msg = document.getElementById('passwordMsg');
  if (!currentPassword || !newPassword) { msg.textContent = 'Please fill in both fields'; return; }
  if (newPassword.length < 6) { msg.textContent = 'New password must be at least 6 characters'; return; }

  const cred = firebase.auth.EmailAuthProvider.credential(currentEmail, currentPassword);
  auth.currentUser.reauthenticateWithCredential(cred)
    .then(() => auth.currentUser.updatePassword(newPassword))
    .then(() => {
      msg.style.color = 'var(--success)';
      msg.textContent = 'Password updated successfully.';
      document.getElementById('currentPassword').value = '';
      document.getElementById('newPassword').value = '';
    })
    .catch(err => {
      msg.style.color = 'var(--danger)';
      msg.textContent = err.message;
    });
}

function loadResources() {
  db.collection('courseContent').doc('main').get().then(doc => {
    const resources = (doc.exists && doc.data().resources) || [];
    const wrap = document.getElementById('resourceWrap');
    wrap.innerHTML = resources.length
      ? resources.map(r => `<div class="resource-row"><span>${r.title}</span><a href="${r.link}" target="_blank"><button>Open</button></a></div>`).join('')
      : '<p style="color:var(--text-faint); font-size:.9rem;">No resources shared yet.</p>';
  });
}

function loadResourceLinks() {
  db.collection('courseContent').doc('main').get().then(doc => {
    const resourceLinks = (doc.exists && doc.data().resourceLinks) || [];
    const wrap = document.getElementById('resourceLinkWrap');
    wrap.innerHTML = resourceLinks.length
      ? resourceLinks.map(r => `<div class="resource-row"><span>${r.title}</span><a href="${r.link}" target="_blank"><button>Open</button></a></div>`).join('')
      : '<p style="color:var(--text-faint); font-size:.9rem;">No links shared yet.</p>';
  });
}

function watchSession(uid, mySession) {
  db.collection('users').doc(uid).onSnapshot(doc => {
    if (doc.exists && doc.data().currentSessionId && doc.data().currentSessionId !== mySession) {
      kickOut(uid);
    }
  });
}

function kickOut(uid) {
  alert('Your account was logged in on another device. For security, you have been logged out here.');
  auth.signOut().then(() => location.href = 'login.html');
}

function doLogout() {
  auth.signOut().then(() => location.href = 'login.html');
}
</script>
</body>
</html>
